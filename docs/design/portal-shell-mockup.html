<title>OSCA Admin</title>
<style>
  /* ============================================================
     Tokens — derived from evolution-ui-2 (src/design/tokens.css
     + themes/dark.css). Same knobs: pure-grey neutral ramp
     (tint-chroma 0), accent seed oklch(0.546 0.215 262.7),
     13px default UI text, 6px/8px control-radius, system font
     stack. Values below are the static resolution of that
     generator for this page, not a reinvented palette.
     ============================================================ */
  :root{
    --ac-1:  oklch(0.985 0.013 262.7);
    --ac-2:  oklch(0.965 0.030 262.7);
    --ac-3:  oklch(0.940 0.052 262.7);
    --ac-6:  oklch(0.800 0.125 262.7);
    --ac-9:  oklch(0.546 0.215 262.7);
    --ac-10: oklch(0.491 0.215 262.7);
    --ac-11: oklch(0.460 0.204 262.7);
    --ac-contrast: #fff;

    --n-1:  oklch(0.988 0 0);
    --n-2:  oklch(0.962 0 0);
    --n-3:  oklch(0.932 0 0);
    --n-4:  oklch(0.900 0 0);
    --n-6:  oklch(0.810 0 0);
    --n-7:  oklch(0.720 0 0);
    --n-9:  oklch(0.500 0 0);
    --n-11: oklch(0.320 0 0);

    --surface-1: oklch(0.955 0 0);   /* shell: rail, top bar */
    --surface-2: oklch(0.995 0 0);   /* content: cards, table rows */
    --surface-3: oklch(0.978 0 0);   /* nested raised */
    --surface-inset: oklch(0.930 0 0);

    --ink: 0 0 0;
    --text-1: rgb(var(--ink) / 89%);
    --text-2: rgb(var(--ink) / 66%);
    --text-3: rgb(var(--ink) / 56%);

    --border-1: rgb(var(--ink) / 10%);
    --border-2: rgb(var(--ink) / 17%);

    --tone-success: #15803d;
    --tone-success-bg: #f0fdf4;
    --tone-warning: #b45309;
    --tone-warning-bg: #fffbeb;
    --tone-danger:  #b91c1c;
    --tone-danger-bg: #fef2f2;
    --tone-info:    #0e7490;
    --tone-info-bg: #ecfeff;
    --tone-neutral-bg: var(--n-2);

    --shadow-sm: 0 1px 2px rgb(38 46 64 / 0.08);
    --shadow-md: 0 2px 8px rgb(38 46 64 / 0.10);

    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Cascadia Code", "Fira Code", Consolas, monospace;

    --r-sm: 4px; --r-md: 6px; --r-lg: 8px;
    --color-bg: var(--surface-1);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ac-1:  oklch(0.21 0.043 262.7);
      --ac-2:  oklch(0.25 0.065 262.7);
      --ac-3:  oklch(0.30 0.090 262.7);
      --ac-6:  oklch(0.47 0.155 262.7);
      --ac-9:  oklch(0.68 0.194 262.7);
      --ac-10: oklch(0.74 0.194 262.7);
      --ac-11: oklch(0.80 0.150 262.7);
      --ac-contrast: #0b0e14;

      --n-1:  oklch(0.17 0 0);
      --n-2:  oklch(0.205 0 0);
      --n-3:  oklch(0.24 0 0);
      --n-4:  oklch(0.28 0 0);
      --n-6:  oklch(0.38 0 0);
      --n-7:  oklch(0.46 0 0);
      --n-9:  oklch(0.64 0 0);
      --n-11: oklch(0.82 0 0);

      --surface-1: oklch(0.165 0 0);
      --surface-2: oklch(0.205 0 0);
      --surface-3: oklch(0.245 0 0);
      --surface-inset: oklch(0.125 0 0);

      --ink: 255 255 255;
      --text-1: rgb(var(--ink) / 92%);
      --text-2: rgb(var(--ink) / 70%);
      --text-3: rgb(var(--ink) / 58%);

      --border-1: rgb(var(--ink) / 12%);
      --border-2: rgb(var(--ink) / 20%);

      --tone-success-bg: rgb(21 128 61 / 0.16);
      --tone-warning-bg: rgb(180 83 9 / 0.18);
      --tone-danger-bg:  rgb(185 28 28 / 0.16);
      --tone-info-bg:    rgb(14 116 144 / 0.18);
      --tone-neutral-bg: var(--n-3);

      --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.35);
      --shadow-md: 0 4px 14px rgb(0 0 0 / 0.4);
      --color-bg: var(--surface-1);
    }
  }
  :root[data-theme="dark"]{
    --ac-1:  oklch(0.21 0.043 262.7);
    --ac-2:  oklch(0.25 0.065 262.7);
    --ac-3:  oklch(0.30 0.090 262.7);
    --ac-6:  oklch(0.47 0.155 262.7);
    --ac-9:  oklch(0.68 0.194 262.7);
    --ac-10: oklch(0.74 0.194 262.7);
    --ac-11: oklch(0.80 0.150 262.7);
    --ac-contrast: #0b0e14;

    --n-1:  oklch(0.17 0 0);
    --n-2:  oklch(0.205 0 0);
    --n-3:  oklch(0.24 0 0);
    --n-4:  oklch(0.28 0 0);
    --n-6:  oklch(0.38 0 0);
    --n-7:  oklch(0.46 0 0);
    --n-9:  oklch(0.64 0 0);
    --n-11: oklch(0.82 0 0);

    --surface-1: oklch(0.165 0 0);
    --surface-2: oklch(0.205 0 0);
    --surface-3: oklch(0.245 0 0);
    --surface-inset: oklch(0.125 0 0);

    --ink: 255 255 255;
    --text-1: rgb(var(--ink) / 92%);
    --text-2: rgb(var(--ink) / 70%);
    --text-3: rgb(var(--ink) / 58%);

    --border-1: rgb(var(--ink) / 12%);
    --border-2: rgb(var(--ink) / 20%);

    --tone-success-bg: rgb(21 128 61 / 0.16);
    --tone-warning-bg: rgb(180 83 9 / 0.18);
    --tone-danger-bg:  rgb(185 28 28 / 0.16);
    --tone-info-bg:    rgb(14 116 144 / 0.18);
    --tone-neutral-bg: var(--n-3);

    --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.35);
    --shadow-md: 0 4px 14px rgb(0 0 0 / 0.4);
    --color-bg: var(--surface-1);
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background: var(--color-bg); color: var(--text-1);
    font-family: var(--font-ui); font-size: 13px; line-height:1.5;
    font-feature-settings:"tnum"; font-variant-numeric: tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  button{ font: inherit; color: inherit; }
  :focus-visible{ outline: 2px solid var(--ac-9); outline-offset: 1px; }

  .shell{
    display:grid; height:100vh;
    grid-template-columns: 60px 216px 1fr;
    grid-template-rows: 44px 1fr;
    grid-template-areas: "top top top" "rail nav main";
  }

  /* ---- top bar ---- */
  .topbar{
    grid-area: top; display:flex; align-items:center; gap:14px;
    padding: 0 12px; background: var(--surface-2);
    border-bottom:1px solid var(--border-1);
  }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:600; font-size:13px; }
  .brand .mark{
    width:20px;height:20px;border-radius:5px;background:var(--ac-9);
    color:var(--ac-contrast); display:flex;align-items:center;justify-content:center;
    font-size:11px; font-weight:700; font-family:var(--font-mono);
  }
  .appswitch{ display:flex; background:var(--n-2); border:1px solid var(--border-1); border-radius:var(--r-md); padding:2px; gap:2px; }
  .appswitch button{ border:0; background:transparent; padding:4px 10px; border-radius:calc(var(--r-md) - 2px); color:var(--text-3); cursor:pointer; }
  .appswitch button.active{ background:var(--surface-2); color:var(--text-1); box-shadow:var(--shadow-sm); font-weight:600; }
  .topbar .sep{ width:1px; align-self:stretch; margin:8px 0; background:var(--border-1); }
  .instance{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-2); }
  .instance b{ color:var(--text-1); font-weight:600; }
  .pill{ font-family:var(--font-mono); font-size:11px; background:var(--n-2); border:1px solid var(--border-1); padding:2px 7px; border-radius:var(--r-sm); color:var(--text-2); }
  .topbar .spacer{ flex:1; }
  .search{ display:flex; align-items:center; gap:6px; background:var(--n-2); border:1px solid var(--border-1); border-radius:var(--r-md); padding:5px 9px; color:var(--text-3); font-size:12px; width:220px; }
  .avatar{ width:24px;height:24px;border-radius:50%; background:var(--n-6); display:flex;align-items:center;justify-content:center; font-size:10px; font-weight:700; color:var(--surface-2); }

  /* ---- module rail ---- */
  .rail{
    grid-area: rail; background:var(--surface-1); border-right:1px solid var(--border-1);
    display:flex; flex-direction:column; align-items:center; padding:10px 0; gap:2px;
  }
  .rail button{
    width:44px;height:44px; border:0; background:transparent; border-radius:var(--r-md);
    display:flex; align-items:center; justify-content:center; color:var(--text-3); cursor:pointer;
    position:relative;
  }
  .rail button svg{ width:19px; height:19px; }
  .rail button:hover{ background:var(--n-2); color:var(--text-1); }
  .rail button.active{ background:var(--ac-3); color:var(--ac-11); }
  .rail button.active::before{
    content:""; position:absolute; left:-10px; top:8px; bottom:8px; width:3px;
    background:var(--ac-9); border-radius:0 2px 2px 0;
  }
  .rail .label{ font-size:9px; margin-top:2px; letter-spacing:.02em; }
  .rail button{ flex-direction:column; gap:2px; }

  /* ---- secondary nav ---- */
  .nav{
    grid-area: nav; background:var(--surface-1); border-right:1px solid var(--border-1);
    padding:16px 10px; overflow-y:auto;
  }
  .nav h2{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-3); margin:2px 8px 8px; font-weight:600; }
  .nav .item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:6px 8px; border-radius:var(--r-sm); color:var(--text-2); cursor:pointer;
    font-size:12.5px; border:0; background:transparent; width:100%; text-align:left;
  }
  .nav .item:hover{ background:var(--n-2); color:var(--text-1); }
  .nav .item.active{ background:var(--ac-2); color:var(--ac-11); font-weight:600; }
  .nav .item .count{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-3); }
  .nav .item.active .count{ color:var(--ac-11); }

  /* ---- main ---- */
  main{ grid-area: main; overflow-y:auto; padding:22px 26px 40px; }
  .crumbs{ font-size:11px; color:var(--text-3); margin-bottom:4px; }
  h1{ font-size:18px; margin:0 0 3px; font-weight:600; text-wrap:balance; }
  .subtitle{ color:var(--text-3); font-size:12.5px; margin:0 0 20px; max-width:60ch; }

  .tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  .tile{ background:var(--surface-2); border:1px solid var(--border-1); border-radius:var(--r-lg); padding:14px 16px; box-shadow:var(--shadow-sm); }
  .tile .k{ font-size:11px; color:var(--text-3); margin-bottom:6px; }
  .tile .v{ font-size:22px; font-weight:600; font-family:var(--font-mono); }
  .tile .d{ font-size:11px; color:var(--text-3); margin-top:4px; }

  .grid2{ display:grid; grid-template-columns: 1.3fr 1fr; gap:16px; align-items:start; }
  .card{ background:var(--surface-2); border:1px solid var(--border-1); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); overflow:hidden; }
  .card .hd{ padding:12px 16px; border-bottom:1px solid var(--border-1); display:flex; align-items:center; justify-content:space-between; }
  .card .hd h3{ margin:0; font-size:13px; font-weight:600; }
  .card .hd .hint{ font-size:11px; color:var(--text-3); }
  .card .bd{ padding:4px 0; }
  .card .bd.pad{ padding:14px 16px; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); padding:8px 16px; font-weight:600; }
  td{ padding:8px 16px; border-top:1px solid var(--border-1); color:var(--text-2); }
  tr:hover td{ background:var(--n-1); }
  td.mono, .mono{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-1); }
  td.strong{ color:var(--text-1); font-weight:500; }

  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:99px; }
  .badge.on{ background:var(--tone-success-bg); color:var(--tone-success); }
  .badge.off{ background:var(--tone-neutral-bg); color:var(--text-3); }
  .badge.warn{ background:var(--tone-warning-bg); color:var(--tone-warning); }
  .badge.info{ background:var(--tone-info-bg); color:var(--tone-info); }
  .dot{ width:6px;height:6px;border-radius:50%; background:currentColor; }

  .list{ display:flex; flex-direction:column; }
  .list .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 16px; border-top:1px solid var(--border-1); }
  .list .row:first-child{ border-top:0; }
  .list .row .t{ color:var(--text-1); font-size:12.5px; }
  .list .row .s{ color:var(--text-3); font-size:11px; }
  .list .row time{ font-family:var(--font-mono); font-size:11px; color:var(--text-3); white-space:nowrap; }

  .roadmap{ border:1px dashed var(--border-2); border-radius:var(--r-lg); padding:14px 16px; margin-top:20px; }
  .roadmap h3{ margin:0 0 3px; font-size:12.5px; }
  .roadmap p{ margin:0 0 10px; font-size:11.5px; color:var(--text-3); max-width:70ch; }
  .roadmap .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .roadmap .chip{ font-size:11px; padding:3px 9px; border-radius:99px; background:var(--tone-warning-bg); color:var(--tone-warning); font-weight:600; }

  .stub{ background:var(--surface-2); border:1px solid var(--border-1); border-radius:var(--r-lg); padding:22px; box-shadow:var(--shadow-sm); }
  .stub .tag{ display:inline-block; font-size:10.5px; font-weight:600; color:var(--text-3); background:var(--n-2); padding:2px 8px; border-radius:99px; margin-bottom:10px; }
  .stub h3{ margin:0 0 6px; font-size:14px; }
  .stub p{ margin:0 0 10px; color:var(--text-2); font-size:12.5px; max-width:62ch; }
  .stub .ep{ font-family:var(--font-mono); font-size:11.5px; background:var(--surface-inset); padding:7px 10px; border-radius:var(--r-sm); color:var(--ac-11); display:inline-block; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border-2); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
</style>

<div class="shell">
  <div class="topbar">
    <div class="brand"><span class="mark">OS</span>OSCA</div>
    <div class="appswitch">
      <button title="Code editor, debugger, explorer">IDE</button>
      <button class="active">Portal</button>
    </div>
    <div class="sep"></div>
    <div class="instance">Instance <b>IRISHEALTH262</b> <span class="pill">2026.2 (221U)</span></div>
    <div class="pill" id="nsPill">%SYS ▾</div>
    <div class="spacer"></div>
    <div class="search">⌘K &nbsp;Search users, apps, tasks…</div>
    <div class="avatar">SC</div>
  </div>

  <div class="rail" id="rail"></div>
  <div class="nav" id="nav"></div>
  <main id="main"></main>
</div>

<script>

};

function stub(endpoint, desc, label){
  return `<div class="stub">
    <span class="tag">${label || 'Wireframe stub · endpoint ready'}</span>
    <h3>Detail view not modelled in this wireframe</h3>
    <p>${desc}</p>
    <span class="ep">${endpoint}</span>
  </div>`;
}

function usersView(){
  const rows = [
    ['Admin','System Administrator','Password user',true],
    ['CSPSystem','Web Gateway user','Password user',true],
    ['IAM','User for /api/iam Web Application','Password user',false],
    ['SuperUser','System Super user','Password user',true],
    ['UnknownUser','Unauthenticated user','Password user',true],
    ['_Ensemble','Interoperability Manager (internal)','Password user',true],

    ['_SYSTEM','SQL System Manager','Password user',true],

  return `<div class="card">
    <div class="hd"><h3>Users</h3><span class="hint">GET /api/admin/v2/security/users</span></div>

function apiExplorerView(){
  return `<div class="card">
    <div class="hd"><h3>API explorer</h3><span class="hint">GET /api/mgmnt/v1/%25SYS/spec/{app}</span></div>
    <div class="bd pad">
      <p style="margin:0 0 12px;color:var(--text-2);max-width:62ch">Every REST app on the instance already publishes its own OpenAPI spec through <span class="mono">/api/mgmnt</span>. Rather than a separate tool, this view embeds a Swagger-style browser fed directly by that endpoint — try any operation on <span class="mono">/api/admin</span>, <span class="mono">/api/atelier</span> or any other registered app without leaving the portal.</p>

function namespacesView(){
  return `<div class="card">
    <div class="hd"><h3>Namespaces</h3><span class="hint">GET /api/admin/v2/namespaces</span></div>
    <div class="bd"><table>

let state = { module:'dashboard', item:'overview' };

function render(){
  const mod = MODULES.find(m=>m.key===state.module);
  const rail = document.getElementById('rail');
  rail.innerHTML = MODULES.map(m=>`
    <button data-mod="${m.key}" class="${m.key===state.module?'active':''}" title="${m.label}">
      ${ICONS[m.icon]}<span class="label">${m.label}</span>
    </button>`).join('');
  rail.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const m = MODULES.find(x=>x.key===b.dataset.mod);
    state = { module:m.key, item:m.nav[0].k };
    render();
  });

  const nav = document.getElementById('nav');
  if(mod.key==='dashboard'){
    nav.innerHTML = `<h2>Overview</h2>
      <div class="item active">Overview</div>
      <h2 style="margin-top:18px">Quick links</h2>
      ${mod.quick.map(q=>`<button class="item" data-go="${q.go[0]}|${q.go[1]}">${q.label}</button>`).join('')}`;
    nav.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
      const [mk,ik] = b.dataset.go.split('|');
      state = { module:mk, item:ik };
      render();
    });
  } else {
    nav.innerHTML = `<h2>${mod.label}</h2>` + mod.nav.map(n=>`
      <button class="item ${n.k===state.item?'active':''}" data-item="${n.k}">
        <span>${n.label}</span>${n.count!==undefined?`<span class="count">${n.count}</span>`:''}
      </button>`).join('');
    nav.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{
      state = { module: mod.key, item: b.dataset.item };
      render();
    });
  }

  const item = mod.nav.find(n=>n.k===state.item) || mod.nav[0];
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="crumbs">Portal / ${mod.label}${mod.key!=='dashboard' ? ' / '+item.label : ''}</div>
    <h1>${mod.key==='dashboard' ? 'Welcome back' : item.label}</h1>
    <p class="subtitle">${mod.key==='dashboard'
      ? 'IRISHEALTH262 · a snapshot of what the Admin API already reports about this instance.'
      : 'Backed by the live InterSystems SysAdmin REST API — no separate backend required for this view.'}</p>
    ${item.view()}
  `;
}

render();
