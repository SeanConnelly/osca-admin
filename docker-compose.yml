services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    image: osca-portal:0.1.0
    container_name: osca-portal
    restart: unless-stopped
    ports:
      # Web server: portal at http://localhost:52773/portal/index.html
      - "52773:52773"
      # Superserver, for IDEs / drivers
      - "1972:1972"
