services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    image: osca-portal:0.1.0
    container_name: osca-portal
    restart: unless-stopped
    ports:
      # Host ports are moved off the IRIS defaults (52773, 1972) so they don't
      # clash with an IRIS instance already running on this machine.
      # Web server: portal at http://localhost:52780/portal/index.html
      - "52780:52773"
      # Superserver, for IDEs / drivers: localhost:51780
      - "51780:1972"
